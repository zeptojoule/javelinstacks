plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.jaca.javelinstacks'

base {
    archivesName = 'javelinstacks'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Se o seu modpack usa outra versão do NeoForge 1.21.1, pode trocar aqui (só precisa ser 21.1.x)
    version = '21.1.172'

    runs {
        client {
            client()
        }
        server {
            server()
            programArguments.add('--nogui')
        }
    }

    mods {
        javelinstacks {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
